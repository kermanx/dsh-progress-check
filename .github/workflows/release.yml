name: Release

# Push a tag matching the manifest version, for example:
#   git tag v0.1.0 && git push origin v0.1.0
# The job packs the checked-in, locally validated artifacts and attaches them to a
# GitHub release. Installing that tarball needs neither npm nor a build
# authorization on the user's machine.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the tag against the manifest version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # DSH master and its test-support packages are not all published to npm.
      # Release exactly the artifacts checked in after local typecheck/test/build,
      # which are also the artifacts installed from the plugin market's Git source.
      - name: Check the prebuilt entrypoints
        run: |
          test -s lib/index.js
          test -s lib/index.d.ts
          test -s lib/client.js
          node --check lib/index.js
          node --check lib/client.js

      # The versioned name keeps each release immutable; the short alias makes
      # the current release reachable through a stable URL.
      - name: Pack the built plugin
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          cd dist
          cp kermanx-dsh-progress-check-*.tgz dsh-progress-check.tgz
          ls -l

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          notes=$(printf 'Install the tarball attached below:\n\n```sh\ndsh plugin --profile web add %s/releases/download/%s/dsh-progress-check.tgz\n```\n\nThe `releases/latest/download/dsh-progress-check.tgz` URL always points at the newest release.\n' "$base" "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes"
