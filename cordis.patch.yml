- insert:
    - id: progress-check
      name: '@kermanx/dsh-progress-check'
      config:
        intervalMs: 60000
        intervalSteps: 5
        maxConcurrent: 1
        timeoutMs: 120000
        maxResponseBytes: 262144
        maxParseRetries: 3
        includeSubagents: false
        onlyWhenVisible: true
